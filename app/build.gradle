plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.ksp)
    id 'kotlin-parcelize'
}

// Optional formal signing: drop keystore.properties (gitignored) next to this module.
// Without it, release APKs fall back to the debug key so they stay installable for testing.
def keystorePropsFile = rootProject.file('keystore.properties')

android {
    // namespace 与主仓保持一致，仅 applicationId 区分 F-Droid 身份，
    // 避免 R/BuildConfig 包名漂移导致全量源码改动。
    namespace 'takagi.ru.monica'
    compileSdk 35

    def previewVersionSuffix = project.findProperty('previewVersionSuffix')?.toString()?.trim()
    // F-Droid build: static version identity. versionCode must increase for every
    // release; override per build with -PappVersionCode=<n> when cutting a release.
    def appVersionCode = project.findProperty('appVersionCode')?.toString()?.toInteger() ?: 13
    def baseVersionName = previewVersionSuffix ? "1.0.306-${previewVersionSuffix}" : "1.0.306"

    def sanitizeTag = { raw, fallback ->
        def value = raw?.toString()?.trim()
        if (!value) {
            return fallback
        }
        def cleaned = value.replaceAll('[^0-9A-Za-z._+-]', '_')
        cleaned ?: fallback
    }

    def resolveArchTag = { output ->
        def manualArch = project.findProperty('apkArch')
        if (manualArch?.toString()?.trim()) {
            return sanitizeTag(manualArch, 'universal')
        }

        if (output?.metaClass?.respondsTo(output, 'getFilters')) {
            def abiFilter = output.filters?.find {
                def typeText = it?.filterType?.toString()
                typeText?.equalsIgnoreCase('ABI') || typeText?.toUpperCase()?.endsWith('.ABI')
            }
            if (abiFilter?.identifier?.toString()?.trim()) {
                return sanitizeTag(abiFilter.identifier, 'universal')
            }
        }

        def configuredAbis = defaultConfig.ndk?.abiFilters
        if (configuredAbis && !configuredAbis.isEmpty()) {
            return sanitizeTag(configuredAbis.toList().sort().join('+'), 'universal')
        }

        'universal'
    }

    defaultConfig {
        applicationId "takagi.ru.monica.fdroid"
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName baseVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // F-Droid build: static values only. Dynamic git SHA / timestamps would make
        // the build output non-reproducible and fail fdroidserver build verification.
        buildConfigField 'String', 'GIT_SHA', '"unknown"'
        buildConfigField 'String', 'BUILD_TIME', '""'
        buildConfigField 'String', 'BASE_VERSION_NAME', "\"${baseVersionName}\""
        buildConfigField 'String', 'FULL_VERSION_NAME', "\"${baseVersionName}\""
        buildConfigField 'String', 'BUILD_DETAIL_TAG', "\"${appVersionCode}\""
        buildConfigField 'int', 'BW_DIAG_SCHEMA', '1'

    }

    splits {
        abi {
            // 仅输出 ARM 32/64 位两个 APK，不生成 universal 包。
            enable true
            reset()
            if (project.hasProperty('includeX86TestAbi')) {
                include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            } else {
                include 'arm64-v8a', 'armeabi-v7a'
            }
            universalApk false
        }
    }

    signingConfigs {
        def keystoreProps = new Properties()
        if (keystorePropsFile.isFile()) {
            keystorePropsFile.withInputStream { keystoreProps.load(it) }
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig keystorePropsFile.isFile() ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
        buildConfig true
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            // 目标格式: Monica-Android-[架构]-[版本号].APK
            def archTag = resolveArchTag(output)
            def versionNameTag = sanitizeTag(baseVersionName, '0.0.0')
            outputFileName = "Monica-Android-${archTag}-${versionNameTag}.APK"
        }
    }

    sourceSets {
        test {
            java {
                // Legacy autofill tests target removed APIs and currently block unit-test compilation.
                // Keep them isolated until the Autofill test suite is rebuilt against current architecture.
                exclude 'takagi/ru/monica/autofill/**'
            }
        }
    }
    lint {
        baseline = file('lint-baseline.xml')
        // Workaround: lint/lifecycle detector crashes with Kotlin 2.x analysis API in current toolchain.
        disable 'NullSafeMutableLiveData',
                'FrequentlyChangingValue',
                'RememberInComposition',
                'FlowOperatorInvokedInComposition',
                'UnrememberedMutableState',
                'AutoboxingStateCreation',
                'CoroutineCreationDuringComposition',
                'StateFlowValueCalledInComposition',
                'ProduceStateDoesNotAssignValue',
                'MissingTranslation'
        // Avoid scanning dependency-provided lint registries; one of them intermittently
        // crashes ASM migration with NegativeArraySizeException in lintVitalAnalyzeRelease.
        checkDependencies false
        // lintVital still loads dependency registries even when checkDependencies is false.
        // Disable the broken release gate so Android Studio's normal assembleRelease works.
        checkReleaseBuilds false
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
        }
    }
}

configurations.configureEach {
    resolutionStrategy.force(
        "org.jetbrains.kotlin:kotlin-bom:2.1.20",
        "org.jetbrains.kotlin:kotlin-stdlib:2.1.20",
        "org.jetbrains.kotlin:kotlin-stdlib-common:2.1.20",
        "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.20",
        "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.1.20",
        "org.jetbrains.kotlinx:kotlinx-serialization-bom:1.6.0",
        "org.jetbrains.kotlinx:kotlinx-serialization-core:1.6.0",
        "org.jetbrains.kotlinx:kotlinx-serialization-core-jvm:1.6.0",
        "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.0",
        "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.6.0"
    )
}

dependencies {
    constraints {
        implementation("org.jetbrains.kotlinx:kotlinx-serialization-core:1.6.0")
        implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.0")
    }

    // Core Android libraries
    implementation project(':mdbx-engine')
    implementation libs.androidx.core.ktx
    implementation libs.androidx.core.splashscreen  // 添加splashscreen依赖
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation "androidx.lifecycle:lifecycle-process:2.8.7"
    implementation libs.androidx.activity.compose
    // Pin profileinstaller to the latest stable patch and avoid older transitive copies.
    implementation "androidx.profileinstaller:profileinstaller:1.4.1"
    
    // Compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    implementation libs.androidx.material3.window.size
    implementation "androidx.compose.animation:animation"
    implementation "androidx.compose.animation:animation-graphics"
    
    // Navigation
    implementation libs.androidx.navigation.compose
    
    // Room Database
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler
    
    // Biometric
    implementation libs.androidx.biometric
    
    // Security
    implementation libs.androidx.security.crypto
    
    // ViewModel
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.compose
    
    // Coroutines
    implementation libs.kotlin.coroutines.android
    
    // Material Icons Extended
    implementation libs.androidx.material.icons.extended
    
    // Fragment and Material Components (for BottomSheet)
    implementation libs.androidx.fragment.ktx
    implementation libs.material
    
    // Autofill and Slice (for InlinePresentation)
    implementation libs.androidx.autofill
    implementation libs.androidx.slice.core
    implementation libs.androidx.slice.builders
    
    // Credentials API (for Passkey support, Android 14+)
    // F-Droid build: credentials-play-services-auth (Google Password Manager client bridge)
    // and play-services-auth (GMS Identity/Drive authorization) removed.
    // Passkey provider functionality uses androidx.credentials:credentials only.
    implementation "androidx.credentials:credentials:1.3.0"

    // DataStore
    implementation libs.androidx.datastore.preferences
    
    // TOTP and QR Code
    implementation libs.zxing.core
    implementation libs.zxing.android.embedded
    
    // Camera
    implementation libs.androidx.camera.core
    implementation libs.androidx.camera.camera2
    implementation libs.androidx.camera.lifecycle
    implementation libs.androidx.camera.view
    
    // Permissions
    implementation libs.accompanist.permissions
    implementation libs.accompanist.drawablepainter
    
    // Kotlinx Serialization
    implementation libs.kotlinx.serialization.json
    
    // WebDAV for cloud backup
    implementation 'com.github.thegrizzlylabs:sardine-android:0.8'
    
    // KeePass KDBX library for KeePass compatibility
    // 0.10.0 is the newest release compatible with the project's Kotlin 1.9 toolchain.
    implementation 'app.keemobile:kotpass:0.10.0'
    
    // WorkManager for auto backup
    implementation libs.androidx.work.runtime.ktx

    // Reorderable for drag-and-drop sorting
    implementation libs.reorderable

    // Koin Dependency Injection (for autofill modularization)
    implementation libs.koin.android
    implementation libs.koin.androidx.compose
    implementation libs.koin.core

    // Markdown rendering
    implementation libs.commonmark
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.22.0'
    implementation 'org.commonmark:commonmark-ext-gfm-strikethrough:0.22.0'
    implementation 'org.commonmark:commonmark-ext-task-list-items:0.22.0'
    
    // Charts for ledger analytics
    // TODO: Re-enable after resolving Kotlin version compatibility
    // implementation libs.vico.compose.m3
    
    // Scrypt for Aegis decryption
    implementation libs.scrypt

    // Password strength analysis, same engine used by Keyguard
    implementation 'com.nulab-inc:zxcvbn:1.9.0'
    
    // ==== Bitwarden Integration ====
    // Retrofit for API calls
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-kotlinx-serialization:2.11.0'
    
    // OkHttp for networking
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0'

    // F-Droid build: Microsoft MSAL / OneDrive login removed (see OneDriveAuthManager stub).

    // BouncyCastle for Argon2 (Bitwarden KDF support)
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    // Native Argon2 backend for Bitwarden Argon2id KDF. This keeps high-memory
    // KDF work off the Android JVM heap.
    implementation('com.lambdapioneer.argon2kt:argon2kt:1.6.0') {
        exclude group: 'androidx.appcompat', module: 'appcompat'
        exclude group: 'androidx.core', module: 'core-ktx'
    }

    // Brand icon loading now uses remote PNG assets from Stratum Auth app
    
    // Testing
    testImplementation libs.junit
    testImplementation libs.kotlin.coroutines.test
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest
}

